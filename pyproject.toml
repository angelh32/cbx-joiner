[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cbz-wrap"
version = "0.1.0"
description = "A simple Python project with a pytest test suite."
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
cbz-wrap = "cbz_wrap.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-ra"
